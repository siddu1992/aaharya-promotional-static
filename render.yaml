services:
  # Render Blueprint for Pure HTML5/CSS3/Bootstrap Static Site (100% Free)
  - type: static
    name: aaharya-promotional-static
    buildCommand: "" # No build required for HTML/CSS static site
    staticPublishPath: ./
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
